name: Android APK bauen
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Nitro importer
        run: |
          python -m pip install numpy pillow
          python -m unittest discover -s tools -p 'test_*.py'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Include signing tool for private asset packaging
        run: |
          python -c 'import os,glob,shutil; paths=glob.glob(os.path.join(os.environ["ANDROID_HOME"],"build-tools","*","lib","apksigner.jar")); assert paths, "Android APK signer not found"; shutil.copyfile(sorted(paths)[-1],"app/build/outputs/apk/debug/apksigner.jar")' 
      - uses: actions/upload-artifact@v4
        with:
          name: Pokemon-with-friends-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/apksigner.jar
