name: Android APK bauen
on:
  pull_request:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Nitro importer
        run: |
          python -m pip install numpy pillow
          python -m unittest discover -s tools -p 'test_*.py'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Include signing tool for private asset packaging
        run: |
          signer=$(rg --files "$ANDROID_HOME/build-tools" | rg '/lib/apksigner.jar$' | sort -V | tail -1)
          test -n "$signer"
          cp "$signer" app/build/outputs/apk/debug/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Pokemon-with-friends-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/apksigner.jar
