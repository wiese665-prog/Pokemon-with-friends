name: Stop obsolete test runs
on:
  push:
    paths:
      - '.github/workflows/cleanup-stale-tests.yml'
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only the two obsolete test runs from this implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/wiese665-prog/Pokemon-with-friends/actions/runs/41151460636/cancel
          gh api --method POST repos/wiese665-prog/Pokemon-with-friends/actions/runs/41150928394/cancel
